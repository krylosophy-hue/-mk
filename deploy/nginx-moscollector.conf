# ============================================================================
# Конфигурация nginx для moscollector.ru — по ИБ-аудиту от 02.10.2026.
# Закрывает: отсутствие защитных заголовков, раскрытие версий, лишний
# Node-слой на статике, отсутствие rate limiting.
#
# Как применить:
#   1. Подставить реальный путь к сборке в root (каталог dist после npm run build).
#   2. Вставить ssl_certificate/ssl_certificate_key из действующего конфига.
#   3. nginx -t && systemctl reload nginx
#   4. Node/Express-процесс, который раздавал статику, после этого не нужен.
# ============================================================================

# Зоны ограничения частоты запросов (объявляются на уровне http {})
limit_req_zone $binary_remote_addr zone=site:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;

server {
    listen 80;
    server_name moscollector.ru www.moscollector.ru;
    return 301 https://moscollector.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.moscollector.ru;
    # ssl_certificate     /etc/nginx/ssl/moscollector.crt;
    # ssl_certificate_key /etc/nginx/ssl/moscollector.key;
    return 301 https://moscollector.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name moscollector.ru;

    # ssl_certificate     /etc/nginx/ssl/moscollector.crt;
    # ssl_certificate_key /etc/nginx/ssl/moscollector.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- не раскрывать версии ПО ---
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # --- защитные заголовки (на все ответы, включая PDF/DOCX) ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP повторяет действующую meta-политику сайта (index.html) — ничего не ломает
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' https: blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://vk.com https://rutube.ru https://play.kinescope.io https://kinescope.io https://dzen.ru https://plvideo.ru https://yandex.ru https://yandex.com; connect-src 'self' https://api.github.com https://*.githubusercontent.com https://dopusk.moscollector.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- статика напрямую из dist, без Node ---
    root /var/www/moscollector/dist;   # <-- путь к сборке
    index index.html;

    location / {
        limit_req zone=site burst=60 nodelay;
        try_files $uri $uri/ /index.html;   # SPA-фоллбэк для BrowserRouter
    }

    # --- админка CMS: строгий лимит; по решению ОИБ можно закрыть по IP ---
    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        # allow 203.0.113.0/24;   # IP-сеть офиса
        # deny all;
        try_files $uri /admin/index.html;
    }

    # --- хешированные ассеты сборки неизменяемы: годовой кэш ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
